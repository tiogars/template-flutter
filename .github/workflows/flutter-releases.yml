name: Flutter releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Default HTTPS API URL compiled into the applications
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-releases-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://api.example.com' }}
  FLUTTER_VERSION: '3.47.5'

jobs:
  android-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: template-flutter
          persist-credentials: false
      # pubspec.yaml references the client through ../template-flutter-api-client
      - uses: actions/checkout@v4.2.2
        with:
          repository: tiogars/template-flutter-api-client
          path: template-flutter-api-client
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Package Android and Linux
        working-directory: template-flutter
        env:
          OUTPUT_DIR: ${{ github.workspace }}/flutter-artifacts
        run: |
          flutter config --no-analytics --enable-linux-desktop
          bash scripts/package-release.sh android linux
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: flutter-android-linux
          path: flutter-artifacts/
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: template-flutter
          persist-credentials: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: tiogars/template-flutter-api-client
          path: template-flutter-api-client
          persist-credentials: false
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Package Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop --no-analytics
          if ($LASTEXITCODE -ne 0) { throw 'Flutter configuration failed.' }
          & ./template-flutter/scripts/package-windows.ps1 -ApiBaseUrl $env:API_BASE_URL -OutputDir (Join-Path $env:GITHUB_WORKSPACE 'flutter-artifacts')
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: flutter-windows
          path: flutter-artifacts/
          if-no-files-found: error
          retention-days: 14

  # Tags publish a GitHub Release; template-react-backend embeds its assets in the console image.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: flutter-*
          merge-multiple: true
          path: flutter-artifacts
      - name: Flatten release assets
        run: |
          mkdir -p assets
          for platform in android linux windows; do
            test -s "flutter-artifacts/$platform/build-info.json"
            cp "flutter-artifacts/$platform/build-info.json" "assets/build-info-$platform.json"
            find "flutter-artifacts/$platform" -maxdepth 1 -type f -name "application-*" -exec cp {} assets/ \;
          done
          ls -l assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
